name: Nightly language and synthesis evidence

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  language-and-synthesis:
    name: Function language and synthesis transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Record required toolchains
        run: |
          python --version
          cc --version

      - name: Run complete test suite
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: "0"
          TZ: UTC
        run: python -m unittest discover -v

      - name: Run bounded-function language growth and native validity study
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: "0"
          TZ: UTC
        run: python -m laicode smoke-function-language "$RUNNER_TEMP/laicode-function-nightly"

      - name: Run matched-budget synthesis transfer study
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: "0"
          TZ: UTC
        run: python -m laicode smoke-function-synthesis "$RUNNER_TEMP/laicode-synthesis-nightly"

      - name: Retain nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/laicode-function-nightly/
            ${{ runner.temp }}/laicode-synthesis-nightly/
          if-no-files-found: warn
          retention-days: 30
